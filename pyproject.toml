[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coderevival"
version = "0.1.0"
description = "Autonomous repository revival tool for Python projects"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[project.scripts]
coderevival = "coderevival.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coderevival*"]
